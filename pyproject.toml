[project]
name = "gestcam"
version = "0.1.0"
description = "Gesture-triggered video reactions (hearts, confetti, fireworks...) as a virtual camera for Linux. Apple-style Reactions for Discord & friends, minus the Mac."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # mediapipe >=1.0 ships a py3-none (ABI-agnostic) manylinux wheel and pulls
    # opencv-contrib-python itself. Do NOT also install opencv-python or
    # opencv-python-headless: two cv2 packages in one env = broken imports.
    "mediapipe>=1.0.1",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "pyvirtualcam>=0.13",
]

[project.scripts]
gestcam = "gestcam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gestcam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
