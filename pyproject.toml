[project]
name = "gestcam"
version = "0.1.0"
description = "Gesture-triggered video reactions (hearts, confetti, fireworks...) as a virtual camera for Linux. Apple-style Reactions for Discord & friends, minus the Mac."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["webcam", "virtual-camera", "gestures", "mediapipe", "v4l2loopback", "discord", "reactions"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Capture",
]
dependencies = [
    # mediapipe pulls opencv-contrib-python itself. Do NOT also install
    # opencv-python or opencv-python-headless: two cv2 packages in one env =
    # broken imports.
    # Pinned <1.0: mediapipe 1.0.1 SIGKILLs the process on the first inference
    # (any running mode, camera or not) on 13th-gen Intel / kernel 7.1. 0.10.x
    # is fine. >=1.0's only draw was the ABI-agnostic wheel, and uv pins 3.12
    # here anyway, so the cp312 wheel covers us.
    "mediapipe>=0.10.21,<1.0",
    "opencv-contrib-python>=4.10",
    "numpy>=1.26",
    "pyvirtualcam>=0.13",
]

[project.urls]
Homepage = "https://github.com/yashksaini-coder/gestcam"
Issues = "https://github.com/yashksaini-coder/gestcam/issues"

[project.scripts]
gestcam = "gestcam.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

# Same list as the extra: the group is what makes plain `uv run pytest` work (uv syncs
# the dev group by default); the extra keeps `pip install -e .[dev]` working.
[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gestcam"]

# README art is for GitHub; keep the 3 MB gif out of the sdist.
[tool.hatch.build.targets.sdist]
exclude = ["docs/img"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Pinned here so CI and every machine lint the same rules (no user-level ruff config).
[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
# House style: `l` for landmark lists, `a; b` for tiny paired test setups.
ignore = ["E741", "E702"]
